version: "3.8"

services:
  www:
    image: node:16
    working_dir: /app
    volumes:
      - .:/app
      - www_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "npm install && exec npx vuepress dev www --host 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure

volumes:
  www_node_modules:
